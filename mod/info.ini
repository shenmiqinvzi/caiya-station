name=CaiYaStation
displayName=菜鸭驿站
description=在仓库区与农场镇找到随机出现的菜鸭驿站，把背包里带不走或不敢带的物品寄回地堡马蜂自提点。运费为货值10%（最低200、最高5000），按货值分档可能丢件；可花金钱与随身物品请拾荒者团或雇佣兵团降低丢件率。每个驿站每局只能发货一次，单次最多12格/25kg。送达后到马蜂自提点领取；死亡不影响已送达货物。零号区没有驿站。面板打开时拦截攻击/使用/交互输入，避免点按钮误开枪。F8诊断面板，Esc关闭面板。包含 Harmony 2.4.1（MIT）。
version=0.1.0
tags=Gameplay,Utility
